name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            librsvg2-dev \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy and report warnings
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          clippy_status=${PIPESTATUS[0]}
          warning_count=$(grep -c 'warning:' "$RUNNER_TEMP/clippy.log" || true)
          echo "Clippy warnings reported: ${warning_count}"
          exit "$clippy_status"
