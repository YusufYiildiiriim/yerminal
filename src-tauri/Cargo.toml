[package]
name = "yerminal"
version = "0.1.0"
description = "Lightweight AI agent terminal workspace"
authors = ["Yusuf"]
edition = "2021"

[lib]
name = "yerminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = "0.20"
toml = "0.9"
sysinfo = "0.40.1"
tauri-plugin-dialog = "2.8.4"
